
       <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mural da Vergonha</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>body{background:#0f0f12;color:#fff;font-family:sans-serif;padding:20px;}.card{background:#17171f;padding:15px;border-radius:10px;border:1px solid #ff4444;}</style>
</head>
<body>
    <div class="card">
        <h3 style="color:#ff4444;text-align:center;">🤡 MURAL DA VERGONHA</h3>
        <div style="padding: 10px; text-align: left;">
            <a href="index.html" style="color: #00ff87; text-decoration: none; font-weight: bold;">← Início</a>
        </div>
        <div id="rank">Carregando...</div>
    </div>
    <script>
        const config = { apiKey: "AIzaSyC0106qe3GnZM6xJyE5OHG-JQsWoWqbHMg", authDomain: "bolao2026-450ff.firebaseapp.com", projectId: "bolao2026-450ff", storageBucket: "bolao2026-450ff.firebasestorage.app", messagingSenderId: "186761975126", appId: "1:186761975126:web:450f60eb0bd1f5e04132f7" };
        firebase.initializeApp(config);
        const db = firebase.firestore();
        
        db.collection("jogos").onSnapshot(snapshotJogos => {
            let placaresReais = {};
            snapshotJogos.forEach(doc => { let j = doc.data(); if(j.id) placaresReais[j.id] = { p1: j.placarReal1, p2: j.placarReal2 }; });
            
            db.collection("usuarios").onSnapshot(snapshotUsers => {
                let r = [];
                snapshotUsers.forEach(doc => {
                    try {
                        let u = doc.data();
                        let pts = 0;
                        
                        if(u.palpites) {
                            for(let id in u.palpites) {
                                let real = placaresReais[id];
                                let aposta = u.palpites[id];
                                if(real !== undefined && real.p1 !== "" && aposta && aposta.p1 == real.p1 && aposta.p2 == real.p2) {
                                    pts += 3;
                                }
                            }
                        }
                        r.push({ nome: u.apelido || "Anon", pts: pts });
                    } catch (e) {
                        console.error("Erro ao processar usuário " + doc.id, e);
                    }
                });
                
                r.sort((a,b) => b.pts - a.pts);
                
                document.getElementById('rank').innerHTML = r.map((u, i) => 
                    `<div style="margin-bottom: 5px;">${i+1}º ${u.nome}: ${u.pts} pts</div>`
                ).join('');
            });
        });
    </script>
</body>
</html>
