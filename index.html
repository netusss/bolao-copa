<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa 2026 - Oitavas de Final 🏆</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #0f0f12; --card: #17171f; --primary: #00ff87; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; min-height: 100vh; padding: 20px; margin: 0; }
        .app-container { width: 100%; max-width: 450px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        
        button.btn-master { width: 100%; padding: 15px; border-radius: 8px; border: none; background: var(--primary); font-weight: bold; font-size: 1.1em; cursor: pointer; margin-top: 10px; color: #111; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; background: #111; color: white; border: 1px solid #444; box-sizing: border-box; }
        
        .match-card { background: #222; border-radius: 8px; border: 1px solid #ffcc00; padding: 15px; margin-bottom: 12px; box-shadow: 0 0 10px rgba(255, 204, 0, 0.2); }
        .match-date { text-align: center; font-size: 0.9em; color: #111; background: var(--primary); padding: 6px; border-radius: 4px; margin-bottom: 12px; font-weight: bold; }
        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .match-row span { flex: 1; text-align: center; font-weight: bold; font-size: 1.1em; }
        .match-row input { width: 55px; text-align: center; margin: 0 5px; font-size: 1.2em; padding: 5px; border-radius: 5px; border: 1px solid #555; background: #0f0f12; color: white; }
        
        #pix-area { display: none; text-align: center; background: #17171f; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 2px dashed var(--primary); color: white; }
        .pix-container { display: flex; gap: 8px; margin-top: 10px; align-items: center; justify-content: center; }
        .btn-copiar { background: var(--primary); color: #111; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Estilo do painel de Admin */
        #admin-panel { display: none; border-color: red; background: #331111; }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- TELA DE LOGIN -->
        <section id="login-screen" class="screen active">
            <h1 style="text-align: center; color: var(--primary);">Bolão Resenha 🏆</h1>
            <p style="text-align: center; color: #aaa; margin-bottom: 20px;">Mata-Mata: Brasil x Japão!</p>
            <input type="text" id="login-nome" placeholder="Seu Nome">
            <input type="tel" id="login-celular" placeholder="Celular (Ex: 75992637960)">
            <input type="text" id="login-apelido" placeholder="Seu Apelido">
            <button class="btn-master" onclick="conectarUsuario()">ENTRAR NO BOLÃO</button>
        </section>

        <!-- TELA DOS JOGOS -->
        <section id="games-screen" class="screen">
            <h2 class="player-nickname" style="color: var(--primary); text-align: center; margin-bottom: 20px;">Bem-vindo</h2>
            
            <!-- PAINEL ADMIN -->
            <div id="admin-panel" class="card">
                <h3 style="color:red; margin-top:0; text-align:center;">🛠️ PAINEL ADMIN</h3>
                <p style="font-size: 0.85em; color: #ffaaaa; text-align:center;">Lançar placar REAL (Fim de Jogo)</p>
                <div class="match-row">
                    <span>🇧🇷 Brasil</span>
                    <input type="number" id="admin_brasil" min="0" placeholder="0">
                    <span>X</span>
                    <input type="number" id="admin_japao" min="0" placeholder="0">
                    <span>🇯🇵 Japão</span>
                </div>
                <button class="btn-master" style="background:red; color:white; font-size:1em;" onclick="salvarResultadoOficial()">Salvar Placar Oficial</button>
            </div>

            <!-- APOSTA MASTER (CAMPEÃO) -->
            <div class="card" style="border-color: var(--primary);">
                <h3 style="color: var(--primary); margin-top: 0;">👑 Aposta Master</h3>
                <label style="font-size: 0.8em; color: #aaa;">Quem será o grande Campeão do Mundo?</label>
                <select id="master-champion-select">
                    <option value="">Escolha a seleção campeã...</option>
                    <option value="Brasil">🇧🇷 Brasil</option>
                    <option value="Japão">🇯🇵 Japão</option>
                    <option value="Argentina">🇦🇷 Argentina</option>
                    <option value="França">🇫🇷 França</option>
                    <option value="Alemanha">🇩🇪 Alemanha</option>
                    <option value="Espanha">🇪🇸 Espanha</option>
                    <option value="Inglaterra">🏴 Escócia / Inglaterra</option>
                    <option value="Portugal">🇵🇹 Portugal</option>
                </select>
                <button class="btn-master" onclick="salvarApostaCampeao()">SALVAR SELEÇÃO CAMPEÃ</button>
            </div>

            <!-- JOGO ÚNICO: BRASIL X JAPÃO -->
            <div class="match-card">
                <div class="match-date">⏰ SEGUNDA-FEIRA - OITAVAS DE FINAL</div>
                <div class="match-row">
                    <span>🇧🇷 Brasil</span>
                    <input type="number" id="placar_brasil" min="0" placeholder="0">
                    <span>X</span>
                    <input type="number" id="placar_japao" min="0" placeholder="0">
                    <span>🇯🇵 Japão</span>
                </div>
                
                <button class="btn-master" id="btn-salvar-jogo" onclick="salvarJogoUnico()">⚽ SALVAR PALPITE (R$ 10,00)</button>
            </div>

            <!-- ÁREA DO PIX -->
            <div id="pix-area" class="card">
                <h3 style="color: var(--primary); margin: 0;">✅ Aposta Registrada!</h3>
                <p>Para validar a sua participação, efetue o pagamento.</p>
                <div class="pix-container">
                    <input type="text" value="63652161572" readonly id="chave-pix" style="text-align: center; margin: 0; color: #00ff87; border: 1px solid #00ff87; background: #111; font-weight: bold; font-size: 1.1em; flex: 1;">
                    <button class="btn-copiar" onclick="copiarPix()">Copiar</button>
                </div>
            </div>

            <button style="background: #333; color: white; border: 1px solid #555; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; margin-top: 20px;" onclick="sairConta()">Sair / Trocar de Conta</button>
        </section>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyC0106qe3GnZM6xJyE5OHG-JQsWoWqbHMg", authDomain: "bolao2026-450ff.firebaseapp.com", projectId: "bolao2026-450ff", storageBucket: "bolao2026-450ff.firebasestorage.app", messagingSenderId: "186761975126", appId: "1:186761975126:web:450f60eb0bd1f5e04132f7" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const CELULAR_ADMIN = "75992637960"; // Seu número de Admin

        function conectarUsuario() {
            let celular = document.getElementById('login-celular').value.replace(/\D/g, '');
            let nome = document.getElementById('login-nome').value;
            let apelido = document.getElementById('login-apelido').value;

            if(!celular || !nome || !apelido) return alert("Por favor, preencha todos os campos!");

            db.collection("usuarios").doc(celular).set({
                nome: nome,
                apelido: apelido
            }, {merge: true}).then(() => {
                localStorage.setItem('bolao_user_celular', celular);
                location.reload();
            });
        }

        function carregarSessao() {
            const salvo = localStorage.getItem('bolao_user_celular');
            if(!salvo) return;

            db.collection("usuarios").doc(salvo).get().then(doc => {
                if(doc.exists) {
                    const dados = doc.data();
                    document.querySelector('.player-nickname').innerText = "Olá, " + dados.apelido;
                    
                    if(dados.campeaoApostado) {
                        document.getElementById('master-champion-select').value = dados.campeaoApostado;
                    }
                    if(dados.jogos && dados.jogos["brasil_japao"]) {
                        let partes = dados.jogos["brasil_japao"].split('x');
                        document.getElementById('placar_brasil').value = partes[0];
                        document.getElementById('placar_japao').value = partes[1];
                        document.getElementById('btn-salvar-jogo').innerText = "✏️ Alterar Aposta";
                    }

                    // Se for você, mostra o painel de Admin
                    if(salvo === CELULAR_ADMIN) {
                        document.getElementById('admin-panel').style.display = 'block';
                    }

                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('games-screen').classList.add('active');
                }
            });
        }

        function salvarJogoUnico() {
            const cel = localStorage.getItem('bolao_user_celular');
            const p1 = document.getElementById('placar_brasil').value;
            const p2 = document.getElementById('placar_japao').value;

            if(p1 === "" || p2 === "") {
                return alert("Preencha o placar do jogo!");
            }

            const placarCompleto = p1 + "x" + p2;

            db.collection("usuarios").doc(cel).set({
                jogos: { "brasil_japao": placarCompleto }
            }, {merge: true}).then(() => {
                alert("Aposta salva com sucesso para Brasil x Japão!");
                document.getElementById('pix-area').style.display = 'block';
            });
        }

        function salvarApostaCampeao() {
            const campeao = document.getElementById('master-champion-select').value;
            const cel = localStorage.getItem('bolao_user_celular');
            if(!campeao) return alert("Escolha uma seleção!");

            db.collection("usuarios").doc(cel).update({
                campeaoApostado: campeao
            }).then(() => {
                alert("Sua aposta master de Seleção Campeã foi salva!");
            });
        }
        
        function salvarResultadoOficial() {
            const p1 = document.getElementById('admin_brasil').value;
            const p2 = document.getElementById('admin_japao').value;

            if(p1 === "" || p2 === "") return alert("Preencha o placar oficial!");
            
            if(confirm("Tem certeza que este é o placar final oficial?")) {
                const placarCompleto = p1 + "x" + p2;
                db.collection("sistema").doc("resultados").set({
                    "brasil_japao": placarCompleto
                }, {merge: true}).then(() => {
                    alert("✅ Placar oficial salvo no sistema!");
                });
            }
        }

        function copiarPix() {
            const chaveInput = document.getElementById("chave-pix");
            chaveInput.select();
            navigator.clipboard.writeText(chaveInput.value).then(() => {
                alert("Chave PIX copiada!");
            });
        }

        function sairConta() {
            localStorage.removeItem('bolao_user_celular');
            location.reload();
        }

        window.onload = carregarSessao;
    </script>
</body>
</html>
